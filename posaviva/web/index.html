<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f13" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <title>PosaViva</title>
  <!-- Critical styles for the very first paint: the page is dark and the splash is
       styled before any script or stylesheet arrives (no white flash, no unstyled text). -->
  <style>
    html, body { margin: 0; height: 100%; background: #0e0f13; color: #eef0f6; overflow: hidden; }
    .pv-loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(120% 70% at 50% 38%, #181a24 0%, #0e0f13 62%); transition: opacity .4s ease;
      font: 14px/1.4 Roboto, 'Google Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    .pv-loading .logo { width: 76px; height: 76px; border-radius: 22px; overflow: hidden; box-shadow: 0 14px 40px rgba(91, 60, 220, .35), 0 2px 6px rgba(0, 0, 0, .4);
      animation: pvLogoIn .5s cubic-bezier(.16, 1, .3, 1) both; }
    .pv-loading .logo svg { display: block; width: 100%; height: 100%; }
    .pv-loading .name { font-size: 22px; font-weight: 650; letter-spacing: .01em; margin-top: 6px; animation: pvLogoIn .5s .05s cubic-bezier(.16, 1, .3, 1) both; }
    .pv-loading .tag { font-size: 13px; color: #9aa1b2; margin-top: -8px; animation: pvLogoIn .5s .1s cubic-bezier(.16, 1, .3, 1) both; }
    .pv-loading .bar { width: 148px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 10px; }
    .pv-loading .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: #7c6cff; animation: pvLoadBar 1.1s infinite ease-in-out; }
    @keyframes pvLoadBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes pvLogoIn { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .pv-loading * { animation-duration: .01ms !important; } }
  </style>
</head>
